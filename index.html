<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برنامه تمرین تا عید 💪</title>

<style>
body{
  background:#0f0f0f;
  color:#fff;
  font-family:tahoma;
  text-align:center;
}
.day{
  border:1px solid #333;
  margin:6px;
  padding:10px;
  border-radius:12px;
  cursor:pointer;
}
.completed{
  background:#064;
  text-decoration:line-through;
}
#menu{
  display:none;
  border:1px solid #00ffcc;
  margin:12px;
  padding:12px;
  border-radius:12px;
}
h2,h3,h4{color:#00ffcc}
button{
  background:#00ffcc;
  border:none;
  padding:8px 14px;
  border-radius:8px;
  margin-top:10px;
  font-weight:bold;
}
.progress{
  height:18px;
  background:#333;
  border-radius:10px;
  margin:12px;
}
.bar{
  height:100%;
  width:0%;
  background:#00ffcc;
  border-radius:10px;
}
hr{border:1px solid #222}
label{display:block;margin:6px 0}
</style>
</head>

<body>

<h2>🔥 برنامه تمرین تا عید 🔥</h2>
<p>🎯 هدف: قدرت، اصلاح پای پرانتزی، نظم خواب و رشد</p>

⏰ ساعت یادآوری:
<input type="time" id="reminderTime">
<button onclick="saveTime()">ذخیره</button>

<div class="progress">
  <div class="bar" id="progressBar"></div>
</div>

<h3 id="scoreText"></h3>

<div id="calendar"></div>

<div id="menu">
  <h3 id="menuTitle"></h3>
  <div id="menuContent"></div>
  <button onclick="closeMenu()">بستن</button>
</div>

<script>
let startDay = 25;
let totalDays = 34;

let data = JSON.parse(localStorage.getItem("planData")) || {
  days:{},
  tasks:{},
  score:0,
  streak:0,
  reminderTime:"18:30"
};

let currentDay=null;

document.getElementById("reminderTime").value=data.reminderTime;
updateScore();

function saveData(){
  localStorage.setItem("planData",JSON.stringify(data));
}

function updateScore(){
  document.getElementById("scoreText").innerText =
  `امتیاز: ${data.score} | استریک: ${data.streak}`;
}

function saveTime(){
  data.reminderTime=document.getElementById("reminderTime").value;
  saveData();
  alert("⏰ ساعت ذخیره شد");
}

function createCalendar(){
  let cal=document.getElementById("calendar");
  cal.innerHTML="";
  let done=0;

  for(let i=0;i<totalDays;i++){
    let d=startDay+i;
    let div=document.createElement("div");
    div.className="day";
    div.innerText="روز "+d;

    if(data.days[d]){
      div.classList.add("completed");
      done++;
    }

    div.onclick=()=>openMenu(d);
    cal.appendChild(div);
  }

  document.getElementById("progressBar").style.width=
  Math.floor(done/totalDays*100)+"%";
}

function getProgram(day){
  let weekday=(day+2)%7;

  if(weekday===4){
    return [
      "🦵 اسکوات اصلاحی 3×15",
      "🦵 پل باسن 3×20",
      "🧘 کشش کامل 20 دقیقه",
      "💊 کلسیم + ویتامین D صبح / منیزیم شب"
    ];
  }

  if(weekday===5){
    return [
      "🚶 پیاده‌روی 30 دقیقه",
      "🧘 کشش عمیق 30 دقیقه",
      "🚿 حمام آب گرم",
      "😴 ریکاوری کامل"
    ];
  }

  return [
    "💪 شنا 4×25 (60ث)",
    "💪 درازنشست 4×25 (45ث)",
    "💪 بارفیکس 5×10 (90ث)",
    "🥊 بوکس 3 راند 3 دقیقه",
    "🧘 کشش 10 دقیقه",
    "🦵 تمرین اصلاح پای پرانتزی",
    "💊 آرژنین بعد تمرین / منیزیم شب"
  ];
}

function openMenu(day){
  currentDay=day;
  document.getElementById("menu").style.display="block";
  document.getElementById("menuTitle").innerText="تمرینات روز "+day;

  let program=getProgram(day);
  let saved=data.tasks[day]||[];
  let html="";

  program.forEach((t,i)=>{
    html+=`
    <label>
      <input type="checkbox" ${saved[i]?"checked":""}
      onchange="checkTasks()">
      ${t}
    </label>`;
  });

  document.getElementById("menuContent").innerHTML=html;
}

function checkTasks(){
  let checks=[];
  document.querySelectorAll("#menuContent input")
  .forEach(cb=>checks.push(cb.checked));

  data.tasks[currentDay]=checks;

  if(checks.every(c=>c)){
    if(!data.days[currentDay]){
      data.days[currentDay]=true;
      data.score+=10;
      data.streak++;
    }
  }else{
    delete data.days[currentDay];
  }

  saveData();
  updateScore();
  createCalendar();
}

function closeMenu(){
  document.getElementById("menu").style.display="none";
}

function checkReminder(){
  let n=new Date();
  let t=n.getHours().toString().padStart(2,"0")+":"+
        n.getMinutes().toString().padStart(2,"0");
  if(t===data.reminderTime && Notification.permission==="granted"){
    new Notification("🔥 وقت تمرینه قهرمان!");
  }
}

if("Notification" in window){
  Notification.requestPermission();
}
setInterval(checkReminder,60000);

createCalendar();
</script>

</body>
</html>
