<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برنامه تمرین</title>

<style>
body{background:#111;color:white;font-family:tahoma;text-align:center}
.day{border:1px solid #444;margin:6px;padding:10px;border-radius:10px;cursor:pointer}
.day:hover{background:#222}
.completed{background:#064;text-decoration:line-through}
#menu{display:none;border:1px solid #0f9;padding:12px;margin:10px;border-radius:10px}
button{padding:8px 14px;border:none;border-radius:8px;background:#0f9;font-weight:bold}
label{display:block;margin:6px 0}
</style>
</head>

<body>

<h2>🔥 برنامه تمرین تا عید 🔥</h2>

<div id="calendar"></div>

<div id="menu">
<h3 id="menuTitle"></h3>
<div id="menuContent"></div>
<button onclick="closeMenu()">بستن</button>
</div>

<script>

document.addEventListener("DOMContentLoaded", function(){

let totalDays=34;
let startDay=25;

let data=JSON.parse(localStorage.getItem("planData")) || {days:{},tasks:{}};
let currentDay=null;

function save(){
localStorage.setItem("planData",JSON.stringify(data));
}

function createCalendar(){
let cal=document.getElementById("calendar");
cal.innerHTML="";
for(let i=0;i<totalDays;i++){
let d=startDay+i;
let div=document.createElement("div");
div.className="day";
div.innerText="روز "+d;
if(data.days[d]) div.classList.add("completed");
div.addEventListener("click",function(){openMenu(d)});
cal.appendChild(div);
}
}

function getProgram(day){
return [
"💪 شنا 4×20",
"💪 درازنشست 4×25",
"🦵 اسکوات اصلاحی 3×15",
"🧘 کشش 10 دقیقه",
"💊 مصرف ویتامین بعد تمرین"
];
}

function openMenu(day){
currentDay=day;
document.getElementById("menu").style.display="block";
document.getElementById("menuTitle").innerText="تمرینات روز "+day;

let program=getProgram(day);
let saved=data.tasks[day]||[];
let html="";

program.forEach((t,i)=>{
html+=`
<label>
<input type="checkbox" ${saved[i]?"checked":""}
onchange="checkTasks()">
${t}
</label>`;
});

document.getElementById("menuContent").innerHTML=html;
}

window.checkTasks=function(){
let checks=[];
document.querySelectorAll("#menuContent input")
.forEach(cb=>checks.push(cb.checked));

data.tasks[currentDay]=checks;

if(checks.every(c=>c)){
data.days[currentDay]=true;
}else{
delete data.days[currentDay];
}

save();
createCalendar();
}

window.closeMenu=function(){
document.getElementById("menu").style.display="none";
}

createCalendar();

});
</script>

</body>
</html>
