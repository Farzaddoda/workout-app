<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برنامه تمرین</title>

<style>
body{background:#111;color:#fff;font-family:tahoma;text-align:center}
.day{border:1px solid #555;margin:6px;padding:10px;border-radius:10px;cursor:pointer}
#menu{display:none;border:1px solid #0f9;margin:10px;padding:10px;border-radius:10px}
label{display:block;margin:6px 0}
</style>
</head>

<body>

<h2>برنامه تمرین</h2>

<div id="calendar"></div>

<div id="menu">
  <h3 id="menuTitle"></h3>
  <div id="menuContent"></div>
</div>

<script>
const calendar = document.getElementById("calendar");
const menu = document.getElementById("menu");
const menuTitle = document.getElementById("menuTitle");
const menuContent = document.getElementById("menuContent");

let data = JSON.parse(localStorage.getItem("data")) || {};
let currentDay = null;

function save(){
  localStorage.setItem("data", JSON.stringify(data));
}

function createCalendar(){
  calendar.innerHTML="";
  for(let d=25; d<=30; d++){
    const div=document.createElement("div");
    div.className="day";
    div.textContent="روز "+d;

    div.addEventListener("click",()=>{
      openMenu(d);
    });

    calendar.appendChild(div);
  }
}

function openMenu(day){
  currentDay=day;
  menu.style.display="block";
  menuTitle.textContent="تمرینات روز "+day;

  const tasks=[
    "شنا 4×25",
    "درازنشست 4×25",
    "بارفیکس 5×10",
    "کشش 10 دقیقه",
    "ویتامین"
  ];

  menuContent.innerHTML="";
  tasks.forEach((t,i)=>{
    const label=document.createElement("label");
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=data[day]?.[i]||false;

    cb.addEventListener("change",()=>{
      if(!data[day]) data[day]=[];
      data[day][i]=cb.checked;
      save();
    });

    label.appendChild(cb);
    label.append(" "+t);
    menuContent.appendChild(label);
  });
}

createCalendar();
</script>

</body>
</html>
